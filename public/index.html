<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>トイレピース 🕊️ — コンビニトイレでわかる街の治安マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>🚽 トイレピース <span class="dove">🕊️</span></h1>
    <p class="tagline">コンビニのトイレが自由に使えるかどうかで、街の治安が見えてくる。</p>
  </header>

  <div id="peace-card">
    <div class="peace-label">この地域のピース指数</div>
    <div id="peace-value">--</div>
    <div id="peace-sample" class="peace-sample">投稿がありません</div>
  </div>

  <div id="legend">
    <div><span class="dot dot-free"></span> 自由に使える</div>
    <div><span class="dot dot-ask"></span> 声かけが必要</div>
    <div><span class="dot dot-forbidden"></span> 使用禁止</div>
    <div><span class="dot dot-none"></span> トイレなし</div>
  </div>

  <button id="add-button" type="button">＋ トイレ情報を投稿</button>
  <div id="add-hint" hidden>地図上のコンビニの場所をタップしてください(ESCでキャンセル)</div>

  <div id="map"></div>

  <dialog id="report-dialog">
    <form id="report-form" method="dialog">
      <h2>トイレ情報を投稿</h2>
      <label>チェーン
        <select name="chain">
          <option value="">選択しない</option>
          <option>セブン-イレブン</option>
          <option>ファミリーマート</option>
          <option>ローソン</option>
          <option>ミニストップ</option>
          <option>デイリーヤマザキ</option>
          <option>セイコーマート</option>
          <option>NewDays</option>
          <option>その他</option>
        </select>
      </label>
      <label>店舗名(任意)
        <input name="storeName" maxlength="200" placeholder="例: 渋谷センター街店" />
      </label>
      <fieldset>
        <legend>トイレの利用状況</legend>
        <label class="radio"><input type="radio" name="status" value="free" required /> 🟢 自由に使える</label>
        <label class="radio"><input type="radio" name="status" value="ask" /> 🟡 声かけが必要</label>
        <label class="radio"><input type="radio" name="status" value="forbidden" /> 🔴 使用禁止</label>
        <label class="radio"><input type="radio" name="status" value="none" /> ⚪ トイレなし</label>
      </fieldset>
      <label>コメント(任意)
        <input name="comment" maxlength="200" placeholder="例: 張り紙あり" />
      </label>
      <div class="dialog-actions">
        <button type="button" id="cancel-button">キャンセル</button>
        <button type="submit" class="primary">投稿する</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
